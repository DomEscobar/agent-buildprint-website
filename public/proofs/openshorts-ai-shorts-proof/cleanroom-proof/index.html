<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenShorts Clean-room Proof</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <span class="pill">Clean-room Buildprint proof</span>
      <h1>Portable AI Shorts Production Studio</h1>
      <p>Product input → analysis → UGC script → actor + voice → mocked provider jobs → 9:16 composition plan → gallery/SEO/social handoff.</p>
      <button id="run">Generate demo short</button>
    </section>
    <section class="grid">
      <article class="card"><h2>Product analysis</h2><pre id="analysis"></pre></article>
      <article class="card"><h2>Script</h2><ol id="segments"></ol></article>
      <article class="card"><h2>Media jobs</h2><ul id="jobs"></ul></article>
      <article class="card wide"><h2>Publish manifest</h2><pre id="manifest"></pre></article>
    </section>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
